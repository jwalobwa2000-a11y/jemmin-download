<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5CFF">
<style>:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);color-scheme:light}[hidden]{display:none!important}</style>
<title>Jemmin Cleaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one phone column, sticky top bars, 4-tab bottom bar, floating red SOS button on every signed-in screen, offer sheet over everything. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF1F7; --fg:#0E1729; --muted:#5A6780; --line:#E3E8F1;
  --brand:#0B5CFF; --brand-ink:#FFFFFF; --brand-soft:#E7EFFF; --brand-text:#0A4FDB;
  --hero-a:#0B5CFF; --hero-b:#0840B8; --on-hero:#FFFFFF; --on-hero-soft:rgba(255,255,255,.86);
  --online:#12A06A; --online-soft:#E1F5EC;
  --ok:#12875A; --ok-soft:#E1F5EC; --warn:#935A00; --warn-soft:#FFF1D6; --bad:#C93A3A; --bad-soft:#FDE8E8;
  --sos:#D92D2D; --sos-ink:#FFFFFF; --star:#F2A900; --logo-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(14,23,41,.06),0 8px 20px rgba(14,23,41,.06);
  --frame:#DCE2EE;
  --f-display:'Plus Jakarta Sans',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1120; --surface:#121B2E; --surface-2:#1A2540; --fg:#E9EEF8; --muted:#97A4BD; --line:#22304B;
    --brand:#4B8BFF; --brand-ink:#04112B; --brand-soft:#14264D; --brand-text:#86B1FF;
    --hero-a:#1D55D6; --hero-b:#0C2C7A; --online:#3FCB8F; --online-soft:#11301F;
    --ok:#3FCB8F; --ok-soft:#11301F; --warn:#F0B24A; --warn-soft:#3A2A08; --bad:#FF7A7A; --bad-soft:#3A1717;
    --sos:#E5484D; --star:#F5B50F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3); --frame:#060B16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#121B2E; --surface-2:#1A2540; --fg:#E9EEF8; --muted:#97A4BD; --line:#22304B;
  --brand:#4B8BFF; --brand-ink:#04112B; --brand-soft:#14264D; --brand-text:#86B1FF;
  --hero-a:#1D55D6; --hero-b:#0C2C7A; --online:#3FCB8F; --online-soft:#11301F;
  --ok:#3FCB8F; --ok-soft:#11301F; --warn:#F0B24A; --warn-soft:#3A2A08; --bad:#FF7A7A; --bad-soft:#3A1717;
  --sos:#E5484D; --star:#F5B50F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3); --frame:#060B16; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--fg);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.2)}}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.page{padding:16px 16px 100px;display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.topbar .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.iconbtn:active{background:var(--surface-2)}
#tabbar{display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border:0;background:none;color:var(--muted);font:500 12px var(--f-body);border-radius:14px}
.tab[aria-current="page"]{color:var(--brand-text);background:var(--brand-soft)}
#app.no-tabs #tabbar{display:none}
.thread{display:flex;flex-direction:column;min-height:100%}
#app.on-help #sos{bottom:auto;top:calc(76px + env(safe-area-inset-top,0px))}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px;overflow-y:auto}
.bub{max-width:82%;padding:11px 14px;border-radius:18px;background:var(--surface-2);font-size:15.5px;line-height:1.5;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bub.them{border-bottom-left-radius:6px}
.composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.composer input:not([type=file]){flex:1;min-width:0;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px;outline:0}
.composer button{width:56px;min-height:50px;border-radius:16px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center}
.composer button svg{width:22px;height:22px}
.ph-btn{background:var(--surface-2)!important;color:var(--brand-text)!important}
.bub-img{display:block;max-width:100%;border-radius:12px;margin-bottom:6px}
.bub-ph{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.08);color:inherit;font:inherit;margin-bottom:6px}
.bub-ph svg{width:18px;height:18px}
.ph-prev{position:relative;padding:8px 16px 0}
.ph-prev img{height:96px;border-radius:12px;border:1px solid var(--line)}
.ph-prev button{position:absolute;top:2px;left:calc(16px + 84px);width:28px;height:28px;border-radius:50%;border:0;background:#111;color:#fff;display:grid;place-items:center}
.ph-prev button svg{width:14px;height:14px}
#sos{position:absolute;right:14px;bottom:82px;z-index:30;width:60px;height:60px;border-radius:50%;border:0;background:var(--sos);color:var(--sos-ink);font:800 15px var(--f-display);letter-spacing:.04em;overflow:hidden;box-shadow:0 8px 22px rgba(217,45,45,.45);touch-action:none;user-select:none;-webkit-user-select:none}
#sos .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.34)}
#sos.hold .fill{height:100%;transition:height 1.5s linear}
#sos span{position:relative}
#app.no-tabs #sos{bottom:20px}
#app.no-sos #sos{display:none}
.logo{display:inline-block;background:var(--logo-bg);border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.logo img{display:block;width:150px;height:auto}
.logo.big img{width:210px}

/* hero */
.hero{background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:var(--on-hero);padding:20px 16px 50px;border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:14px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero .tag{font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.hero .hi{color:var(--on-hero-soft);font-size:15px}
.hero h1{font:800 27px/1.1 var(--f-display);letter-spacing:-.02em}
.onlinecard{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;padding:16px;background:var(--surface);color:var(--fg);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.onlinecard b{display:block;font:700 18px var(--f-display)}
.onlinecard small{color:var(--muted);font-size:13.5px}
.pdot{width:14px;height:14px;border-radius:50%;background:var(--muted);flex:none}
.onlinecard[aria-checked="true"] .pdot{background:var(--online);box-shadow:0 0 0 0 var(--online);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.switch{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;margin-left:auto;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
[aria-checked="true"] .switch{background:var(--online)}
[aria-checked="true"] .switch i{transform:translateX(24px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px;padding:0 0}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.stat b{font:700 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}

/* shared */
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sect-head h2{font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.link{border:0;background:none;color:var(--brand-text);font:600 15px var(--f-body);display:flex;align-items:center;gap:2px;padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 12.5px/1.3 var(--f-body);background:var(--brand-soft);color:var(--brand-text);white-space:nowrap}
.pill .ic{width:15px;height:15px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:600 16px var(--f-body);text-decoration:none}
.btn:active{filter:brightness(.94)}
.btn.off{opacity:.45}
.btn.good{background:var(--online);color:#fff}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.line{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;padding:0 16px;width:auto}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:30px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font:700 17px var(--f-display)}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:600 16px var(--f-body)}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 15px var(--f-body);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font:600 15px var(--f-body)}
.input{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;outline:0}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.input-ic{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 16px;min-height:58px;color:var(--muted)}
.input-ic input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:19px;color:var(--fg)}
.input-ic:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.hint{color:var(--muted);font-size:14px}
.otp{letter-spacing:.9em;text-align:center;font:700 30px var(--f-display);padding-left:.9em}
.note{background:var(--brand-soft);color:var(--brand-text);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.demo{border:1.5px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:transparent}
.demo .lbl2{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);border:2px solid color-mix(in srgb,var(--brand) 25%,transparent);display:grid;place-items:center;font:700 22px var(--f-display);flex:none}
.sum{display:flex;flex-direction:column}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.sum div:first-child{border-top:0}
.sum span:first-child{color:var(--muted)}
.sum span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sum .total span:last-child{font:700 19px var(--f-display);color:var(--online)}
.price{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .9s linear infinite;margin:6px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 4px}
.center h3{font:700 20px var(--f-display)}
.bigcheck{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.bigcheck .ic{width:36px;height:36px}

/* job */
.stepbar{display:flex;gap:4px}
.stepbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepbar i.on{background:var(--brand)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stephead b{font:700 17px var(--f-display)}
.jobhead{padding:16px;display:flex;flex-direction:column;gap:12px}
.jobhead h2{font:800 22px/1.15 var(--f-display);letter-spacing:-.01em}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money div{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.money div.earn{background:var(--online-soft)}
.money small{color:var(--muted);font-size:12.5px}
.money b{font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.money .earn b{color:var(--online)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h4{margin:0;font:700 14px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.task{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:13px 12px;font-size:15px;line-height:1.35}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent}
.task.read .box{width:8px;height:8px;border:0;border-radius:50%;background:var(--brand)}
button.task{width:100%;border:0;text-align:left}
button.task[aria-checked="true"]{background:var(--online-soft)}
button.task[aria-checked="true"] .box{background:var(--online);border-color:var(--online);color:#fff}
button.task[aria-checked="true"] span:last-child{color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--online);border-radius:4px;transition:width .25s}
.qrbox{background:#fff;border-radius:20px;padding:10px;width:min(78vw,290px);margin:0 auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.code{font:800 36px/1 var(--f-display);letter-spacing:.16em;text-align:center;padding:18px 0 18px .16em;background:var(--brand-soft);color:var(--brand-text);border-radius:16px;font-variant-numeric:tabular-nums}
.pulse2{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:pulse2 1.2s infinite;flex:none}
@keyframes pulse2{50%{opacity:.25}}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--star)}
.stars .ic{width:38px;height:38px}

/* history + earnings */
.hist{padding:14px 16px;display:flex;gap:12px;align-items:center}
.hist b{display:block;font:600 16px var(--f-body)}
.hist .amt{font:700 17px var(--f-display);color:var(--online);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--brand-soft);min-height:4px}
.bars .b.today i{background:var(--brand)}
.bars .b small{color:var(--muted);font-size:12px}
.bars .b em{font:600 11px var(--f-body);font-style:normal;color:var(--fg);font-variant-numeric:tabular-nums}
.bigmoney{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* sheets */
#sheetWrap,#offerWrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-end}
#offerWrap{z-index:70}
.scrim{position:absolute;inset:0;background:rgba(6,12,26,.6)}
.sheet{position:relative;width:100%;max-width:480px;max-height:94%;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;outline:0}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.sheet-head h2{font:700 20px/1.2 var(--f-display);flex:1;min-width:0}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cd{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cd i{display:block;height:100%;background:var(--brand);animation:cd 45s linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.ringing{display:flex;align-items:center;gap:10px;color:var(--brand-text);font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.ringing .ic{animation:ring .9s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
#banner{pointer-events:none;position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;width:min(448px,calc(100% - 24px));background:var(--fg);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:down .25s ease-out}
@keyframes down{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#banner b{display:block;font:700 15px var(--f-display)}
#banner span{font-size:13.5px;opacity:.9}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font:500 14.5px var(--f-body);max-width:min(440px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">

  const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34]];

  for (let i = 0; i < 4 && bits.length < dataCw * 8; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const cw = [];
  for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }

  for (let i = 0; i < dpb; i++) for (let b = 0; b < nb; b++) out.push(blocks[b][i]);

  const N = 17 + 4 * v;
  const M = [], F = [];

  const setF = (r, c, val) => { if (r >= 0 && c >= 0 && r < N && c < N) { M[r][c] = val ? 1 : 0; F[r][c] = true; } };
  const finder = (r0, c0) => { for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) { const inside = r >= 0 && r <= 6 && c >= 0 && c <= 6; const on = inside && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)); setF(r0 + r, c0 + c, on); } };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);

      if (i < 8) G[8][N - i - 1] = m; else if (i < 9) G[8][15 - i - 1 + 1] = m; else G[8][15 - i - 1] = m;
    }
    G[N - 8][8] = 1;
    return G;
  };
  const penalty = G => {
    let p = 0;
    for (let pass = 0; pass < 2; pass++) for (let a = 0; a < N; a++) {
      let run = 1;
      for (let b = 1; b < N; b++) {
        const cur = pass ? G[b][a] : G[a][b], prev = pass ? G[b - 1][a] : G[a][b - 1];
        if (cur === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
      }
    }
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) { const s = G[r][c] + G[r][c + 1] + G[r + 1][c] + G[r + 1][c + 1]; if (s === 0 || s === 4) p += 3; }
    const pat = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0], rev = pat.slice().reverse();
    const eq = (get, a) => { let m1 = true, m2 = true; for (let k = 0; k < 11; k++) { const val = get(a + k); if (val !== pat[k]) m1 = false; if (val !== rev[k]) m2 = false; } return m1 || m2; };
    for (let a = 0; a < N; a++) for (let b = 0; b <= N - 11; b++) { if (eq(k => G[a][k], b)) p += 40; if (eq(k => G[k][a], b)) p += 40; }
    let dark = 0; G.forEach(row => row.forEach(v2 => dark += v2));
    p += Math.floor(Math.abs(dark * 100 / (N * N) - 50) / 5) * 10;
    return p;
  };

async function authCall(path,body){
 let r;try{r=await fetch(SB_URL+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('No internet connection. Check your data and try again.')}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error(authMsg((j&&(j.msg||j.message||j.error_description||j.error))||('Error '+r.status)));
 return j;
}
function authMsg(m){
 m=String(m);
 if(/already registered|already been registered/i.test(m))return 'This phone number is already registered. Tap "Sign in" instead.';
 if(/not confirmed/i.test(m))return 'Your account was created while Supabase still required email confirmation. In Supabase open Authentication, Users, delete this user, then register again.';
 if(/invalid login/i.test(m))return 'Wrong phone number or PIN. Try again.';
 if(/password should be|at least 6/i.test(m))return 'Your PIN must be 6 digits.';
 if(/email.*(invalid|not valid)/i.test(m))return 'Sign-up was rejected by the server: '+m;
 return m;
}
function setSess(j){S.sess={access:j.access_token,refresh:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user.id}}
async function refreshSess(){
 if(!S.sess||!S.sess.refresh)return false;
 try{const j=await authCall('/auth/v1/token?grant_type=refresh_token',{refresh_token:S.sess.refresh});setSess(j);save();return true}catch(e){return false}
}
async function sb(path,o={}){
 const method=o.method||'GET';
 if(S.sess&&S.sess.exp-Math.floor(Date.now()/1000)<60)await refreshSess();
 const h={apikey:SB_KEY,'Content-Type':'application/json'};
 if(S.sess)h.Authorization='Bearer '+S.sess.access;
 if(o.prefer)h.Prefer=o.prefer;
 let r;try{r=await fetch(SB_URL+path,{method,headers:h,body:o.body?JSON.stringify(o.body):undefined})}catch(e){throw new Error('No internet connection')}
 if(r.status===401&&S.sess&&!o.retried){if(await refreshSess())return sb(path,Object.assign({},o,{retried:true}));localSignOut('Please sign in again');throw new Error('Please sign in again')}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.hint))||('Error '+r.status));
 return j;
}

const PUSH_APP='cleaner';
async function pushSave(){
 try{if(pushSetup.tok&&S.sess)await rpc('register_device',{p_token:pushSetup.tok,p_app:PUSH_APP})}catch(e){}
}
async function pushSetup(){
 try{
  const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.PushNotifications;
  if(!P||!S.sess)return;
  if(!pushSetup.bound){
   pushSetup.bound=true;
   P.addListener('registration',t=>{pushSetup.tok=t.value;try{localStorage.setItem(KEY+'.push',t.value)}catch(e){}pushSave()});
   P.addListener('registrationError',()=>{});
   const ch=[['jobs','Job offers',5],['sos','SOS alerts',5],['default','Updates',4]];
   for(const c of ch){try{await P.createChannel({id:c[0],name:c[1],description:'Jemmin notifications',importance:c[2],visibility:1,vibration:true})}catch(e){}}
  }
  let p=await P.checkPermissions();
  if(p.receive!=='granted')p=await P.requestPermissions();
  if(p.receive!=='granted')return;
  if(pushSetup.tok)pushSave();
  await P.register();
 }catch(e){}
}
function pushOff(){
 try{
  const t=pushSetup.tok||localStorage.getItem(KEY+'.push');if(!t||!S.sess)return;
  fetch(SB_URL+'/rest/v1/rpc/unregister_device',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+S.sess.access},body:JSON.stringify({p_token:t})}).catch(()=>{});
 }catch(e){}
}

async function loadHistory(){
 const r=await sb('/rest/v1/jobs?cleaner_id=eq.'+uid()+'&status=eq.paid&order=paid_at.desc&limit=100&select=id,ref,service_id,area,price,cleaner_pay,paid_at');
 S.history=(r||[]).map(x=>({id:x.id,ref:x.ref,service:svcName(x.service_id),area:x.area,price:x.price,earn:x.cleaner_pay,paidAt:x.paid_at,status:'done'}));
}
async function buildJob(r,prev){
 const p=(Array.isArray(r.job_private)?r.job_private[0]:r.job_private)||{};
 let first=prev&&prev.first;
 if(!first){try{const [c]=await sb('/rest/v1/profiles?id=eq.'+r.client_id+'&select=full_name');first=((c&&c.full_name)||'Client').trim().split(' ')[0]||'Client'}catch(e){first='Client'}}
 const old=(prev&&prev.tasks)||[];
 let raw=Array.isArray(r.tasks)?r.tasks:[];
 if(!raw.length)raw=T_STD.map(x=>({g:x[0],t:x[1]}));
 const tasks=raw.map((t,i)=>({g:t.g||'Tasks',t:t.t||String(t),d:!!(old[i]&&old[i].d)}));
 return {id:r.id,ref:r.ref,service:svcName(r.service_id),first,area:r.area,estate:p.address||'',notes:p.notes||'',lat:(p.lat==null?null:+p.lat),lng:(p.lng==null?null:+p.lng),code:p.entry_code||'',
  price:r.price,earn:r.cleaner_pay,when:r.scheduled_at||r.created_at,status:r.status,tasks,test:r.client_id===uid(),clientId:r.client_id};
}
const JOB_SEL='select=*,job_private(address,notes,entry_code,lat,lng)';
async function loadActive(){
 const r=await sb('/rest/v1/jobs?cleaner_id=eq.'+uid()+'&status=in.(accepted,enroute,arrived,progress,review,payment,paid)&'+JOB_SEL+'&order=created_at.desc&limit=3');
 for(const row of (r||[])){
  if(row.status==='paid'){
   if(row.client_id===uid())continue;const age=Date.now()-new Date(row.paid_at||row.created_at).getTime();if(age>864e5)continue;
   const rv=await sb('/rest/v1/reviews?job_id=eq.'+row.id+'&from_id=eq.'+uid()+'&select=id');if(rv&&rv.length)continue;
  }
  const prev=S.job&&S.job.id===row.id?S.job:null;
  S.job=await buildJob(row,prev);save();return;
 }
 if(S.job){S.job=null;save()}
}
async function boot(){
 if(!S.sess)return;
 S.booting=true;
 try{await loadMe();await Promise.all([loadHistory(),loadActive()]);pushSetup()}catch(e){if(S.sess)toast(e.message)}
 S.booting=false;render();
}
function localSignOut(msg){S.team=[];S.ph={};S.teamPhoto=null;pushOff();S.sess=null;S.user=null;S.online=false;S.job=null;S.offer=null;S.history=[];closeOffer();save();S.route='signin';S.authErr=msg||'';render()}

/* ---------- alerts: sound, vibrate, banner ---------- */
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A();[0,.28].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.22);o.start(c.currentTime+t);o.stop(c.currentTime+t+.25)})}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function banner(title,body){const b=$('#banner');b.innerHTML=`${ic('bell')}<div><b>${esc(title)}</b><span>${esc(body)}</span></div>`;b.hidden=false;beep();buzz([200,100,200]);clearTimeout(banner.t);banner.t=setTimeout(()=>{b.hidden=true},5000)}

/* ---------- navigation ---------- */
const TABS=['home','jobs','earn','profile'];
function nav(route){
 if(!S.user&&route!=='signin')route='signin';
 if(TABS.includes(route))S.stack=[];else if(S.route!==route)S.stack.push(S.route);
 S.route=route;S.scrollTop=true;render();
}
function back(){S.route=S.stack.pop()||'home';S.scrollTop=true;render()}
function render(){
 if(!S.user&&S.route!=='signin')S.route='signin';
 if(S.user&&S.route==='signin')S.route='home';
 if(S.route==='job'&&!S.job)S.route='home';
 const v={home:vHome,jobs:vJobs,earn:vEarn,profile:vProfile,job:vJob,help:vHelp,signin:vSignin}[S.route]||vHome;
 const sc=$('#screen'),keep=sc.scrollTop;
 sc.innerHTML=v();
 sc.scrollTop=S.scrollTop?0:keep;S.scrollTop=false;
 const app=$('#app'),authScreen=S.route==='signin';
 app.classList.toggle('no-tabs',authScreen);app.classList.toggle('on-help',S.route==='help');
 app.classList.toggle('no-sos',authScreen);
 $('#tabbar').innerHTML=[['home','home','Home'],['jobs','jobs','Jobs'],['earn','wallet','Earnings'],['profile','user','Profile']]
  .map(([r,i,l])=>`<button class="tab" data-a="tab" data-v="${r}" ${S.route===r||(S.route==='job'&&r==='jobs')||(S.route==='help'&&r==='profile')?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
}
function topbar(title,{back:b=false,right=''}={}){return `<header class="topbar">${b?`<button class="iconbtn" data-a="back" aria-label="Back">${ic('back')}</button>`:''}<span class="grow">${esc(title)}</span>${right}</header>`}

/* ---------- derived numbers ---------- */
function stats(){
 const done=S.history;
 const today=done.filter(h=>dayDiff(new Date(h.paidAt))===0);
 const week=done.filter(h=>dayDiff(new Date(h.paidAt))<7);
 const sum=a=>a.reduce((s,h)=>s+h.earn,0);
 const rating=S.user&&S.user.ratingN?(+S.user.rating).toFixed(1):'New';
 return {today:sum(today),todayN:today.length,week:sum(week),weekN:week.length,all:sum(done),allN:done.length,rating};
}

function shrinkImg(file,max){
 max=max||960;
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{try{
   const k=Math.min(1,max/Math.max(im.width,im.height));const w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
   const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
   URL.revokeObjectURL(url);
   let q=.8,d=c.toDataURL('image/jpeg',q);
   while(d.length>150000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
   if(d.length>170000)throw new Error('That photo is too big. Please try another.');
   res(d);
  }catch(e){URL.revokeObjectURL(url);rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that photo. Please choose another.'))};
  im.src=url;
 });
}

 else LOCST=getPos.err===1?'Location is blocked. Open phone Settings, Apps, Jemmin Cleaner, Permissions, Location, and allow it.':getPos.err===3?'Could not find your position. Go near a window and try again.':'Your phone did not give a location. Check that Location is switched on.';

 await sb('/rest/v1/cleaners?id=eq.'+uid(),{method:'PATCH',body:{online:on,area:S.user.area},prefer:'return=minimal'});
 S.online=on;save();render();toast(on?'You are online':'You are offline');
 if(on){setTimeout(poll,500);shareLoc(true)}
}
const A={
 legal:d=>legalSheet(d.v),
 locNow:()=>{LOCST='Checking...';render();shareLoc(true)},
 tab:d=>nav(d.v),back:()=>back(),
 help:d=>{const j=S.job;S.helpDraft=(d.d==='job'&&j)?'Problem with job '+(j.ref||'')+': ':'';nav('help');loadHelp().catch(()=>{})},
 phPick:()=>{const i=$('#helpPhoto');if(i)i.click()},
 phClear:()=>{S.teamPhoto=null;const i=$('#helpInput');if(i)S.helpKeep=i.value;render()},
 phView:d=>guard(async()=>{await loadPhoto(d.v)}),
 openJob:()=>nav('job'),
 toggleOnline:()=>guard(()=>setOnline(!S.online)),
 sendTest:()=>guard(async()=>{
  if(!S.online)await setOnline(true);
  await rpc('create_test_job');S.seen={};toast('Test job created');
 }).then(()=>setTimeout(poll,300)),
 accept:()=>guard(acceptOffer),
 decline:()=>guard(async()=>{const id=S.offer&&S.offer.id;S.seen[id]=1;closeOffer();render();if(id)await rpc('decline_job',{p_job:id});toast('Offer declined')}),
 startTrip:()=>guard(()=>step('enroute')),
 arrived:()=>guard(()=>step('arrived')),
 demoScan:()=>guard(async()=>{await rpc('verify_entry',{p_job:S.job.id,p_code:S.job.code,p_cleaner:uid()});S.job.status='progress';save();S.scrollTop=true;render();toast('Entry approved.')}),
 tick:d=>{const t=S.job.tasks[+d.v];t.d=!t.d;save();render()},
 complete:()=>{const left=S.job.tasks.filter(t=>!t.d).length;if(left){toast(left+' task'+(left>1?'s':'')+' left. Tick every task first.');return}guard(async()=>{await step('review');toast('Sent to the client to check')})},
 demoVerify:()=>guard(async()=>{await rpc('confirm_job',{p_job:S.job.id});S.job.status='payment';save();S.scrollTop=true;render()}),
 demoPay:()=>guard(async()=>{await rpc('test_pay',{p_job:S.job.id});S.job.status='paid';save();S.scrollTop=true;await loadHistory();await loadMe();render();banner('Payment received',KES(S.job.earn)+' for '+S.job.service)}),
 rateStar:d=>{S.rate.n=+d.v;render()},
 rateTag:d=>{const i=S.rate.tags.indexOf(d.v);if(i>=0)S.rate.tags.splice(i,1);else S.rate.tags.push(d.v);render()},
 submitReview:()=>{if(!S.rate.n){toast('Tap a star rating first');return}guard(async()=>{
  const j=S.job;
  if(!j.test){try{await sb('/rest/v1/reviews',{method:'POST',prefer:'return=minimal',body:{job_id:j.id,from_id:uid(),to_id:j.clientId,stars:S.rate.n,tags:S.rate.tags,comment:S.rate.text||null}})}catch(e){if(!/duplicate|unique/i.test(e.message))throw e}}
  await finishJob()})},
 cancelAsk:()=>{S.cancelAsk=true;render()},cancelNo:()=>{S.cancelAsk=false;render()},
 cancelYes:()=>guard(async()=>{await rpc('cleaner_release',{p_job:S.job.id});S.job=null;S.cancelAsk=false;save();nav('home');toast('Job cancelled')}),
 jobTab:d=>{S.jobTab=d.v;render()},
 sheetClose:()=>closeSheet(),
 sosSend:()=>sendSOS(),
 sosRetry:()=>{S.sos=null;sendSOS()},
 sosDrop:()=>{S.sos=null;save();closeSheet()},
 sosReason:d=>{if(!S.sos||!S.sos.id)return;S.sos.reason=S.sos.reason===d.v?'':d.v;save();sosSheet();if(S.sos.reason)rpc('sos_update',{p_id:S.sos.id,p_reason:S.sos.reason,p_safe:false}).catch(()=>{})},
 sosClear:()=>{if(!S.sos||!S.sos.id)return;S.sos.status='cleared';save();sosSheet();rpc('sos_update',{p_id:S.sos.id,p_reason:'',p_safe:true}).catch(()=>{})},
 photoPick:()=>{if(S.photoBusy)return;const f=document.createElement('input');f.type='file';f.accept='image/*';f.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';f.id='pFileLive';document.body.appendChild(f);f.addEventListener('change',()=>{const x=f.files&&f.files[0];setTimeout(()=>{try{f.remove()}catch(e){}},500);savePhoto(x)});f.click();setTimeout(()=>{try{f.remove()}catch(e){}},120000)},
 signout:()=>guard(async()=>{try{if(S.online)await sb('/rest/v1/cleaners?id=eq.'+uid(),{method:'PATCH',body:{online:false},prefer:'return=minimal'})}catch(e){}localSignOut('')}),
 authSwitch:()=>{S.authMode=S.authMode==='up'?'in':'up';S.authErr='';render()},
 authGo:()=>guard(async()=>{
  const up=S.authMode==='up';
  const p=normPhone($('#phone').value),pin=$('#pin').value.trim(),e=$('#authErr');
  const fail=m=>{S.authErr=m;e.textContent=m;e.hidden=false};
  if(!p)return fail('Enter a valid Kenyan number, for example 0712345678.');
  if(!/^\d{6}$/.test(pin))return fail('Your PIN must be exactly 6 digits.');
  let name='';
  if(up){name=$('#nm').value.trim();if(name.length<2)return fail('Enter your name.');if($('#pin2').value.trim()!==pin)return fail('The two PINs do not match.');if(!$('#agree')||!$('#agree').checked)return fail('Please tick the box to agree to the Terms and Privacy Policy.')}
  S.authErr='';e.hidden=true;$('#authGo').textContent='Please wait…';
  try{
   let j;
   if(up){
    j=await authCall('/auth/v1/signup',{email:emailOf(p),password:pin,data:{role:'cleaner',full_name:name,phone:p}});
    if(!j||!j.access_token){$('#authGo').textContent='Create account';return fail('Account created, but Supabase still asks for email confirmation. In Supabase go to Authentication, Sign In / Providers, Email, and switch "Confirm email" OFF. Then tap Sign in.')}
   }else j=await authCall('/auth/v1/token?grant_type=password',{email:emailOf(p),password:pin});
   setSess(j);S.user={id:j.user.id,phone:p,name:name,area:'Westlands',approved:false,rating:0,ratingN:0,done:0};
   await loadMe();await Promise.all([loadHistory(),loadActive()]);pushSetup();
   S.stack=[];S.route='home';S.scrollTop=true;save();render();toast(up?'Account created':'Signed in');
  }catch(err){
   S.sess=null;S.user=null;save();
   const e2=$('#authErr');S.authErr=err.message;if(e2){e2.textContent=err.message;e2.hidden=false}
   const b=$('#authGo');if(b)b.textContent=up?'Create account':'Sign in';
  }
 })
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset,t)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&['phone','pin','pin2','nm'].includes(e.target.id)){A.authGo();return}
 if(e.key==='Escape'&&S.sheet)closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.id==='sos'){e.preventDefault();sosSheet()}
});
document.addEventListener('submit',e=>{
 if(e.target.dataset.f!=='helpSend')return;e.preventDefault();
 const inp=e.target.querySelector('input:not([type=file])');const v=inp.value;inp.value='';helpSend(v);
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.k;if(!k)return;const v=e.target.value;
 if(k==='pin'||k==='pin2'){e.target.value=v.replace(/\D/g,'').slice(0,6)}
 else if(k==='rText'){S.rate.text=v}
 if(['phone','pin','pin2','nm'].includes(k)){const x=$('#authErr');if(x)x.hidden=true;S.authErr=''}
});
document.addEventListener('change',e=>{
 if(e.target.id==='helpPhoto'){const f=e.target.files&&e.target.files[0];if(!f)return;const i=$('#helpInput');if(i)S.helpKeep=i.value;
  shrinkImg(f,960).then(d=>{S.teamPhoto=d;render()}).catch(er=>toast(er.message));return}
 const k=e.target.dataset.k;if(!k||!S.user)return;
 if(k==='pArea'){S.user.area=e.target.value;save();sb('/rest/v1/cleaners?id=eq.'+uid(),{method:'PATCH',body:{area:S.user.area},prefer:'return=minimal'}).then(()=>toast('Area saved')).catch(er=>toast(er.message))}
 if(k==='pBio'){S.user.bio=e.target.value.trim().slice(0,160);save();rpc('set_my_profile',{p_photo:S.user.photo||null,p_bio:S.user.bio||null}).then(()=>toast('Intro saved')).catch(er=>toast(er.message))}
 if(k==='pName'){S.user.name=e.target.value.trim();save();sb('/rest/v1/profiles?id=eq.'+uid(),{method:'PATCH',body:{full_name:S.user.name},prefer:'return=minimal'}).then(()=>toast('Name saved')).catch(er=>toast(er.message))}
});

/* SOS: press and hold for 1.5 seconds */
(()=>{
 const b=$('#sos');let t=null;
 const stop=()=>{if(t){clearTimeout(t);t=null;b.classList.remove('hold');toast('Hold the red button for 2 seconds to send an alert')}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('hold');t=setTimeout(()=>{t=null;b.classList.remove('hold');sendSOS()},1500)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
 b.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ---------- profile photo ---------- */
function shrinkPhoto(file,size){
 size=size||256;
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{try{
   const m=Math.min(im.width,im.height);if(!m)throw new Error('Could not read that photo');
   const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
   x.fillStyle='#fff';x.fillRect(0,0,size,size);
   x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,size,size);
   URL.revokeObjectURL(url);
   let q=.82,d=c.toDataURL('image/jpeg',q);
   while(d.length>22000&&q>.3){q-=.08;d=c.toDataURL('image/jpeg',q)}
   res(d);
  }catch(e){URL.revokeObjectURL(url);rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that photo. Please choose another.'))};
  im.src=url;
 });
}
async function savePhoto(file){
 if(!file||S.photoBusy)return;
 if(!/^image\//.test(file.type||'image/'))return toast('Please choose a photo');
 S.photoBusy=true;render();
 try{
  const d=await shrinkPhoto(file,256);
  await rpc('set_my_profile',{p_photo:d,p_bio:S.user.bio||null});
  S.user.photo=d;save();toast('Photo saved');
 }catch(e){toast(e.message||'Could not save the photo',4000)}
 S.photoBusy=false;render();
}

/* ---------- boot ---------- */
load();
if(!S.user||!S.sess){S.user=null;S.sess=null;S.route='signin'}
render();
boot();
})();
